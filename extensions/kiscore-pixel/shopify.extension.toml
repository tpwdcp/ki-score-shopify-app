name = "kiscore-pixel"
type = "web_pixel_extension"
uid = "3cea890b-213a-c58f-f927-96048dc2b1de10606bff"

runtime_context = "strict"

# Only analytics: the pixel counts visits from AI answers for the merchant's
# own statistics, no ads, no personalisation, no sale of data.
[customer_privacy]
analytics = true
marketing = false
preferences = false
sale_of_data = "disabled"

# The public KIscore site ID of the shop. Never a secret: pixel settings are
# readable on the storefront.
[settings]
type = "object"

[settings.fields.siteId]
name = "KIscore site ID"
description = "Site ID of the website in KIscore"
type = "single_line_text_field"
validations = [
  { name = "min", value = "1" }
]
