# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e15810f0310e262ad3a46291d35b0719"
name = "KIscore Pilot"
# Custom distribution for one pilot shop. The public app is shopify.app.toml;
# a distribution method cannot be changed once selected.
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_reports: KIscore reads the shop's session statistics (ShopifyQL).
scopes = "read_reports"

[access.admin]
embedded_app_direct_api_access = true
direct_api_mode = "online"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[webhooks]
api_version = "2027-01"

# Mandatory for every app in the App Store. KIscore holds no customer data,
# so the two customer topics are only acknowledged; shop/redact erases the
# connection and the imported session statistics of the shop.
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://api.kiscore.ai/api/v1/shopify/webhooks"

# KIscore drops the shop's tokens and stops the nightly import.
[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "https://api.kiscore.ai/api/v1/shopify/webhooks"

[build]
automatically_update_urls_on_dev = true
