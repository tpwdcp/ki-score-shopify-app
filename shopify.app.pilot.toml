# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e15810f0310e262ad3a46291d35b0719"
name = "KIscore Pilot"
# Custom distribution for one pilot shop. The public app is shopify.app.toml;
# a distribution method cannot be changed once selected.
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Same as shopify.app.toml; read_reports is for the ShopifyQL test with the
# pilot shop (AI channels and bot share of its sessions).
scopes = "write_pixels,read_customer_events,read_reports"

[access.admin]
embedded_app_direct_api_access = true
direct_api_mode = "online"

[app_proxy]
url = "https://api.kiscore.ai/shopify/app_proxy"
prefix = "apps"
subpath = "kiscore"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[webhooks]
api_version = "2027-01"

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
