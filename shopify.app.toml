# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "33eaebf84b954b4cc5a7d71413172060"
name = "KIscore"
# Not a placeholder: extension-only apps use Shopify's default app home, the
# admin page is the app-home extension that Shopify serves itself.
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[webhooks]
api_version = "2027-01"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_reports: KIscore reads the shop's session statistics (ShopifyQL).
scopes = "read_reports"

# The app home stores the connection in a metafield through the Admin API.
[access.admin]
embedded_app_direct_api_access = true
direct_api_mode = "online"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
